<button type="button" aria-label="Abrir modal para crear evento"
  class="$$btn flex min-w-21 w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg max-h-12 px-5 py-1 flex-1 bg-primary text-blanco-puro text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors"
  (click)="openModal()">{{ textoBoton }}</button>
<dialog #modalRef class="$$modal modal-eventos" (click)="$event.stopPropagation()">
  <div class="$$modal-box">
    <div class="$$modal-action px-4 py-4 flex flex-col items-center gap-4">
      <form (ngSubmit)="onCrearEvento()" method="dialog" class="flex flex-col items-center gap-4 w-full">
        <div class="w-full flex flex-col gap-2 items-center mt-2">
          <input class="input input-bordered w-full" placeholder="Nombre del evento" [value]="nombreEvento()"
            (input)="nombreEvento.set($any($event.target).value)" name="nombreEvento" />
          <input class="input input-bordered w-full" type="date" placeholder="Fecha del evento"
            [value]="fechaEvento()" (input)="fechaEvento.set($any($event.target).value)" name="fechaEvento" />
          <input class="input input-bordered w-full" type="time" placeholder="Hora del evento" [value]="horaEvento()"
            (input)="horaEvento.set($any($event.target).value)" name="horaEvento" />
          <input class="input input-bordered w-full" placeholder="Dirección (opcional)" [value]="direccionEvento()"
            (input)="direccionEvento.set($any($event.target).value)" name="direccionEvento" />
          <textarea class="textarea textarea-bordered w-full min-h-28" placeholder="Descripción del evento"
            [value]="descripcionEvento()" (input)="descripcionEvento.set($any($event.target).value)"
            name="descripcionEvento"></textarea>
          <button class="$$btn btn-primary w-full" type="button" [disabled]="creandoEvento()" (click)="onCrearEvento()">
            {{ creandoEvento() ? 'Creando...' : 'Crear evento' }}
          </button>
        </div>
        @if (feedback() && !errorSesion()) {
        <div class="text-success">{{feedback()}}</div>
        }
        @if (errorSesion()) {
        <div class="text-error">{{feedback()}}</div>
        <btn-inicio-sesion />
        }
      </form>
      <button class="$$btn mt-2 btn btn-secondary" type="button" (click)="modalRef.close()">Cerrar</button>
    </div>
  </div>
</dialog>
