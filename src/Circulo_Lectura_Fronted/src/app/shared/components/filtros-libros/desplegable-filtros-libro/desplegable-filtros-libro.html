<details class="flex flex-col border-t border-gray-300 dark:border-gray-700 py-2 group" [open]="abierto()">
  <summary class="flex cursor-pointer items-center justify-between gap-6 py-2">
    <p class="text-gray-900 dark:text-white text-sm font-medium leading-normal">
      {{ titulo() }}
    </p>
    <div class="text-gray-600 dark:text-gray-400 group-open:rotate-180 transition-transform">
      <span class="material-symbols-outlined">expand_more</span>
    </div>
  </summary>
  <div class="max-h-56 overflow-y-auto pr-2">
    @for (item of opciones(); track item.id) {
    <label class="flex gap-x-3 py-2 flex-row items-center">
      <input
        class="h-5 w-5 rounded border-gray-400 dark:border-gray-600 border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none"
        style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');"
        type="checkbox" [checked]="seleccionados().has(item.id)" (change)="onToggleOpcion(item.id)" />
      <p class="text-gray-700 dark:text-gray-300 text-sm font-normal leading-normal">
        {{ item.etiqueta }}
      </p>
    </label>
    }
  </div>
</details>
