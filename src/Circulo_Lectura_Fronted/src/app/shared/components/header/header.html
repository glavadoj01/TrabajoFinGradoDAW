<header class="w-full max-w-full border-b border-primary bg-background-main/80 backdrop-blur-sm mx-auto">
  <!-- Contenedor Responsive -->
  <div
    class="w-max-full flex flex-row items-center justify-between gap-0.5 md:gap-6 whitespace-nowrap px-1 md:px-6 lg:px-10 py-3">
    <app-header-logo />
    <nav class="hidden lg:flex ">
      <app-nav-links class="flex items-center gap-8" aria-label="Navegación principal" />
    </nav>
    <div class="w-2/3 hidden lg:block lg:w-full">
      <app-search-bar></app-search-bar>
    </div>
    <!-- Botones de Autenticación, Tema y Menú Móvil -->
    <div class="flex items-center gap-3 lg:gap-6">
      <app-auth-buttons class="gap-6 items-center hidden lg:flex" />
      <button (click)="toggleTheme()" class="btn btn-circle bg-btn-secondary lg:ml-5
                    hover:bg-btn-secondary-hover focus-visible:outline-none focus-visible:ring-2 
                    focus-visible:ring-btn-secondary-focus active:bg-btn-secondary-pressed transition-colors">
        <img src="/luna.svg" alt="Luna" class="size-[1.2em]">
      </button>
      <button #openBtn (click)="toggleMenu()" aria-controls="mobile-menu" [attr.aria-expanded]="isMenuOpen()" class="lg:hidden flex items-center justify-center size-10 rounded-lg bg-btn-secondary
                    hover:bg-btn-secondary-hover focus-visible:outline-none focus-visible:ring-2 
                    focus-visible:ring-btn-secondary-focus active:bg-btn-secondary-pressed transition-colors">
        <span class="material-symbols-outlined text-white">menu</span>
      </button>
    </div>
  </div>
  <app-search-bar class="block lg:hidden w-full px-4 pb-3" />
</header>

<!-- Desplegable Nav en pantalla pequeña -->
<div #menu id="mobile-menu" class="fixed inset-0 z-50 lg:hidden" [class.hidden]="!isMenuOpen()"
  [attr.aria-hidden]="!isMenuOpen()">
  <!-- Backdrop (resto pantalla para cierre) -->
  <div #backdrop (click)="backdropClick($event)" (keyup)="backdropKeyUp($event)"
    class="absolute inset-0 bg-black/40 z-40">
  </div>

  <!-- Panel (aside) -->
  <div #panel
    class="absolute right-0 top-0 h-full w-4/5 max-w-xs bg-background-element shadow-lg transform translate-x-full transition-transform duration-300 ease-in-out z-50"
    [class.translate-x-0]="isMenuOpen()" [class.translate-x-full]="!isMenuOpen()" aria-modal="true"
    aria-labelledby="mobile-menu-title">
    <div class="p-4">
      <div class="flex items-center justify-between">
        <h2 id="mobile-menu-title" class="text-blanco-puro font-bold">Menú</h2>
        <button #closeBtn (click)="hideMenu()" aria-label="Cerrar menú" class="text-text-secondary hover:text-white">
          ✕
        </button>
      </div>

      <nav (click)="panelLinkClick($event)" (keyup)="panelLinkKeyUp($event)" class="mt-4 flex flex-col gap-2"
        aria-label="Navegación del menú móvil">
        <app-nav-links class="flex flex-col gap-2" />
      </nav>
      <div class="mt-6">
        <app-auth-buttons class="flex flex-col gap-2" />
      </div>
    </div>
  </div>
</div>
